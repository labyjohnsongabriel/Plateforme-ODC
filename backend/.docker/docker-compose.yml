version: '3.9'

services:
  # ==================== POSTGRESQL ====================
  postgres:
    image: postgres:15-alpine
    container_name: odc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: odc_db
      POSTGRES_USER: odc_user
      POSTGRES_PASSWORD: odc_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - odc_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - odc_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odc_user -d odc_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== BACKEND ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: odc_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      API_PREFIX: /api
      CLIENT_URL: http://localhost:5173

      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: odc_user
      DB_PASSWORD: odc_password
      DB_NAME: odc_db
      DB_LOGGING: "false"

      JWT_SECRET: change_me_in_production_min_32_chars_xxxxxxxx
      JWT_REFRESH_SECRET: change_me_in_production_min_32_chars_yyyyyyyy
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d

      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_PASS: ""
      SMTP_FROM: "Orange Digital Center <noreply@odc.mg>"

      UPLOAD_DIR: ./uploads
      MAX_FILE_SIZE: "10485760"
      LOG_LEVEL: info
      LOG_DIR: ./logs
    ports:
      - "5000:5000"
    volumes:
      - odc_uploads:/app/uploads
      - odc_logs:/app/logs
    networks:
      - odc_network

  # ==================== FRONTEND ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: odc_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"
    networks:
      - odc_network

  # ==================== PGADMIN (optionnel) ====================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: odc_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@odc.mg
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - odc_network
    profiles: ["tools"]

volumes:
  odc_pgdata:
  odc_uploads:
  odc_logs:

networks:
  odc_network:
    driver: bridge